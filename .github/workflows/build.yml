name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Generate android shell
        run: |
          # 备份我们自己的代码，flutter create 会覆盖 lib/ 与 pubspec.yaml
          rm -rf /tmp/keep && mkdir -p /tmp/keep
          cp -r lib /tmp/keep/lib
          cp pubspec.yaml /tmp/keep/pubspec.yaml
          flutter create --platforms=android --org com.qi --project-name qi_duiyi --overwrite .
          # 还原我们的代码
          rm -rf lib && cp -r /tmp/keep/lib lib
          cp /tmp/keep/pubspec.yaml pubspec.yaml
          echo "--- restored lib ---"
          ls -R lib
          head -12 lib/main.dart

      - name: Patch identity
        run: |
          set +e
          MAN=android/app/src/main/AndroidManifest.xml
          GRADLE=""
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] && GRADLE="$f" && break
          done
          echo "gradle file = $GRADLE"
          sed -i 's/android:label="qi_duiyi"/android:label="棋·对弈"/' $MAN
          if [ -n "$GRADLE" ]; then
            sed -i 's#com\.qi\.qi_duiyi#com.qi.duiyi#g' "$GRADLE"
            echo "--- gradle identity ---"
            grep -n 'applicationId\|namespace' "$GRADLE"
          fi
          sed -i 's#com\.qi\.qi_duiyi#com.qi.duiyi#g' $MAN
          OLD=android/app/src/main/kotlin/com/qi/qi_duiyi
          if [ -d "$OLD" ]; then
            mkdir -p android/app/src/main/kotlin/com/qi/duiyi
            mv $OLD/MainActivity.kt android/app/src/main/kotlin/com/qi/duiyi/MainActivity.kt
            sed -i 's/package com\.qi\.qi_duiyi/package com.qi.duiyi/' android/app/src/main/kotlin/com/qi/duiyi/MainActivity.kt
            rmdir $OLD
          fi
          grep -q VIBRATE $MAN || sed -i 's#<application#<uses-permission android:name="android.permission.VIBRATE"/>\n    <application#' $MAN
          echo "--- manifest ---"
          cat $MAN
          exit 0

      - name: Build
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64

      - name: Collect
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/qiduiyi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: qiduiyi-apk
          path: out/qiduiyi.apk
          retention-days: 30
